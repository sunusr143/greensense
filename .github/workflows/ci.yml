name: ci
on:
  push:
  pull_request:

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lambda unit tests
        run: python -m unittest discover -s lambda -v
      - name: Local end-to-end simulation
        run: python simulator/simulate.py 60
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio==6.1.16
      - name: Build with placeholder secrets
        working-directory: firmware
        run: |
          cp include/secrets.h.example include/secrets.h
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: firmware/.pio/build/esp32dev/firmware.bin
